name: Java checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Java source and checks
        run: |
          mkdir -p build/classes
          javac -d build/classes src/main/java/demo/catalog/*.java src/test/java/demo/catalog/*.java
      - name: Run checks
        run: java -cp build/classes demo.catalog.CatalogSelfTest
      - name: Run example
        run: java -cp build/classes demo.catalog.Main
